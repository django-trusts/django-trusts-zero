name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # Core #118 condition registry (pair pin for Zero #16).
  COMPANION_KERNEL_SHA: 948d6666342377b9472debb57d4a1e26e81402d1

jobs:
  tests:
    name: tests vs core #118 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install core #118 then Zero
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage virtualenv
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Zero tests (no core AppConfig)
      run: coverage run -m tests.runtests && coverage report
    - name: Fresh install + makemigrations --check
      run: python scripts/verify-fresh-install.py
    - name: Old backend path fails startup
      run: python scripts/verify-old-backend-path.py

  pair:
    name: pair with core #118 condition registry
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact core #118 pair
      run: |
        test "${COMPANION_KERNEL_SHA}" = "948d6666342377b9472debb57d4a1e26e81402d1"
        test "$(git -C .deps/django-trusts rev-parse HEAD)" = "948d6666342377b9472debb57d4a1e26e81402d1"
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        coverage run -m tests.runtests
        python scripts/verify-fresh-install.py
        python scripts/verify-old-backend-path.py

  package:
    name: package / wheel
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine virtualenv "Django>=6.1,<6.2"
        python -m build
        twine check dist/*
    - name: Package metadata (version, core floor, LICENSE)
      run: python scripts/verify-package-metadata.py
    - name: Wheel RECORD isolation + import
      run: python scripts/verify-wheel-install.py
    - name: Uninstall isolation
      run: python scripts/verify-uninstall-isolation.py
