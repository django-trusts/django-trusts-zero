name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # Merged core Step I (django-trusts#109 merge). Pair pin for Zero IIa.
  COMPANION_KERNEL_SHA: 39f1f9611e214193aec4e97526cf9b54ee689967

jobs:
  tests:
    name: tests vs Step I (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Step I kernel then Zero IIa
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage virtualenv
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Zero IIa tests (no core AppConfig)
      run: coverage run -m tests.runtests && coverage report
    - name: Fresh install + makemigrations --check
      run: python scripts/verify-fresh-install.py
    - name: Old backend path fails startup
      run: python scripts/verify-old-backend-path.py

  pair:
    name: pair with merged core Step I
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact Step I pair
      run: |
        test "${COMPANION_KERNEL_SHA}" = "39f1f9611e214193aec4e97526cf9b54ee689967"
        test "$(git -C .deps/django-trusts rev-parse HEAD)" = "39f1f9611e214193aec4e97526cf9b54ee689967"
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
        coverage run -m tests.runtests
        python scripts/verify-fresh-install.py
        python scripts/verify-old-backend-path.py

  package:
    name: package / wheel
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine virtualenv "Django>=6.1,<6.2"
        python -m build
        twine check dist/*
    - name: Wheel RECORD isolation + import
      run: python scripts/verify-wheel-install.py
    - name: Uninstall isolation
      run: python scripts/verify-uninstall-isolation.py
