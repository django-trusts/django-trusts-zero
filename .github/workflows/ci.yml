name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Paired kernel: S5 merge (runtime / backend / decorators / admin / checks).
  COMPANION_KERNEL_SHA: 4d09045db0094cc40811af87c7783fa8f85acd90

jobs:
  pair:
    name: pair with kernel S5
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: This wheel + exact companion HEAD
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage virtualenv build twine
        python -m build
        twine check dist/*
        python scripts/verify-companion-pair.py --kernel .deps/django-trusts

  tests:
    name: tests vs kernel S5 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts
        ref: ${{ env.COMPANION_KERNEL_SHA }}
        path: .deps/django-trusts
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install kernel S5 then Zero (with dependency resolution)
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage virtualenv
        python -m pip install -e .deps/django-trusts --config-settings editable_mode=compat
        python -m pip install -e . --config-settings editable_mode=compat
    - name: Zero tests
      run: coverage run -m tests.runtests && coverage report
    - name: Fresh / legacy / already-current
      run: |
        python scripts/verify-fresh-install.py
        python scripts/verify-legacy-upgrade.py
        python scripts/verify-upgrade-current.py
